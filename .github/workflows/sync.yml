name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN2 }}
        run: git push --force https://UNITY-TMIA:$HF_TOKEN@huggingface.co/spaces/UNITY-TMIA/UNITY-Volunteer main
